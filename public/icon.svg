<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="moonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#spaceGrad)" />
  
  <!-- Outer Celestial Orbital Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6,8" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#475569" stroke-width="2" opacity="0.4" />

  <!-- Harmonic Sine Wave (Tidal / Circadian Wave) -->
  <path d="M 66 256 Q 161 140, 256 256 T 446 256" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- Radiant Sun (Left Apex) -->
  <g transform="translate(160, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="38" fill="url(#sunGlow)" />
    <!-- Sun Rays -->
    <path d="M 0 -52 L 0 -44 M 0 52 L 0 44 M -52 0 L -44 0 M 52 0 L 44 0 M -36 -36 L -30 -30 M 36 36 L 30 30 M -36 36 L -30 30 M 36 -36 L 30 -30" stroke="#fcd34d" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Glowing Crescent Moon (Right Apex) -->
  <g transform="translate(340, 230)" filter="url(#glow)">
    <path d="M 0 -42 A 42 42 0 0 0 32 30 A 34 34 0 1 1 0 -42 Z" fill="url(#moonGlow)" />
  </g>

  <!-- Central Compass Star / Core Nucleus -->
  <circle cx="256" cy="256" r="10" fill="#38bdf8" />
  <circle cx="256" cy="256" r="18" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  
  <!-- Subtle Cardinal Ticks -->
  <line x1="256" y1="46" x2="256" y2="60" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="256" y1="452" x2="256" y2="466" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="46" y1="256" x2="60" y2="256" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="452" y1="256" x2="466" y2="256" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
</svg>
